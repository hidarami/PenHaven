name: flow
description: PenHaven — a digital sanctuary for writers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  uuid: ^4.5.1
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  image_cropper: ^10.0.0+1
  pdf: ^3.11.1
  http: ^1.2.2
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  flutter_markdown: ^0.7.3
  confetti: ^0.7.0
  phosphor_flutter: ^2.1.0
  url_launcher: ^6.2.4
  google_sign_in: ^6.2.2
  supabase_flutter: ^2.5.0
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  crypto: ^3.0.5
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

dependency_overrides:
  app_links: 7.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/atmosphere/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FEF8EC"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: false