<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1410"/>
      <stop offset="55%" stop-color="#100C09"/>
      <stop offset="100%" stop-color="#050403"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#207BD5" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#207BD5" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#207BD5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0EBE3"/>
      <stop offset="100%" stop-color="#B8C8E8"/>
    </linearGradient>
    <linearGradient id="quillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5FB8E0"/>
      <stop offset="55%" stop-color="#207BD5"/>
      <stop offset="100%" stop-color="#0F4A88"/>
    </linearGradient>
    <linearGradient id="inkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#207BD5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#207BD5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="poolGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3FA0E8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3FA0E8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="url(#glowGrad)"/>

  <!-- Stars -->
  <g fill="#EAF0FF">
    <circle cx="120" cy="96" r="2.4" opacity="0.8"/>
    <circle cx="392" cy="118" r="1.8" opacity="0.6"/>
    <circle cx="360" cy="70" r="1.4" opacity="0.5"/>
    <circle cx="88" cy="150" r="1.6" opacity="0.55"/>
    <circle cx="430" cy="180" r="2.0" opacity="0.5"/>
    <circle cx="150" cy="60" r="1.2" opacity="0.45"/>
  </g>

  <!-- Moon -->
  <circle cx="336" cy="150" r="58" fill="url(#moonGrad)" opacity="0.92"/>
  <circle cx="360" cy="132" r="50" fill="url(#bgGrad)"/>

  <!-- Ink pool -->
  <ellipse cx="222" cy="392" rx="118" ry="30" fill="url(#poolGrad)"/>
  <ellipse cx="222" cy="392" rx="86" ry="18" fill="#0B0805" opacity="0.55"/>

  <!-- Quill feather -->
  <g>
    <path d="M 176 372
             C 150 330, 148 260, 196 196
             C 232 148, 288 118, 344 108
             C 320 150, 300 196, 292 236
             C 336 220, 372 224, 398 246
             C 358 250, 322 268, 296 296
             C 322 300, 344 316, 356 340
             C 320 336, 288 344, 264 364
             C 246 378, 232 386, 214 388
             Z"
          fill="url(#quillGrad)"/>
    <g stroke="#E9F5FF" stroke-width="2" opacity="0.35" stroke-linecap="round">
      <path d="M 210 344 C 240 320, 268 300, 300 288" fill="none"/>
      <path d="M 198 308 C 232 280, 268 256, 308 238" fill="none"/>
      <path d="M 196 264 C 228 232, 264 204, 306 182" fill="none"/>
      <path d="M 204 222 C 232 190, 264 160, 300 138" fill="none"/>
    </g>
    <path d="M 344 108 C 288 152, 236 210, 196 268 C 176 298, 168 330, 178 366"
          fill="none" stroke="#F5FBFF" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M 178 366 L 168 400 L 196 386 Z" fill="#0F4A88"/>
  </g>

  <!-- Ink drip -->
  <path d="M 182 388 C 186 402, 188 414, 182 424 C 176 414, 176 400, 182 388 Z"
        fill="url(#inkGrad)"/>

  <!-- Outer ring accent -->
  <rect x="6" y="6" width="500" height="500" rx="108" fill="none"
        stroke="#207BD5" stroke-opacity="0.14" stroke-width="2"/>
</svg>